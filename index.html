<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shopping</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/fontawesome.min.css" integrity="sha512-SMQ1DwSGiIDyNoXdQae7kUBADdtQa8Xsb3LxBxzAXExZNCCH/36yQSpZSYo1c6ckFshd1iMp9eD9+s9+tdhmyg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="cart-toggle-btn" onclick="toggleCart()">🛒</button>
    <button class="toast" id="toast">Product Added</button>
    <div class="left">
        <span class="s1">🛒 Shopping Cart</span> <br />
        <input type="text" placeholder="search products..."
         oninput="searchProducts()" 
        id="search" />

        <div class="products" id="products"></div>
    </div>      
    <div class="cart">
        <span class="s2">🛍️ Your Cart</span>
        <div class="cart-c" id="cart-c"></div>
        <p class="total" id="total">Total:$0</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
